class CustomerBookingScreen extends StatefulWidget {
  final String customerPhone;
  const CustomerBookingScreen({super.key, required this.customerPhone});

  @override
  State<CustomerBookingScreen> createState() => _CustomerBookingScreenState();
}

class _CustomerBookingScreenState extends State<CustomerBookingScreen> {
  final TextEditingController pickupCtrl = TextEditingController(text: 'Connaught Place, Central Delhi');
  final TextEditingController dropCtrl = TextEditingController(text: 'Sector 62, Noida');
  int selectedVehicle = 2;
  bool isSendingOrder = false;

  final List<Map<String, dynamic>> fleets = [
    {'name': '2-Wheeler', 'cap': '20 kg', 'fare': '₹55', 'icon': Icons.two_wheeler},
    {'name': '3-Wheeler', 'cap': '500 kg', 'fare': '₹195', 'icon': Icons.electric_rickshaw},
    {'name': 'Tata Ace', 'cap': '750 kg', 'fare': '₹290', 'icon': Icons.local_shipping},
    {'name': 'Pickup 8ft', 'cap': '1200 kg', 'fare': '₹480', 'icon': Icons.fire_truck_sharp},
  ];

  @override
  Widget build(BuildContext context) {
    final activeVehicle = fleets[selectedVehicle];

    return Column(
      children: [
        Container(
          margin: const EdgeInsets.all(12),
          padding: const EdgeInsets.all(14),
          decoration: BoxDecoration(color: Colors.white, borderRadius: BorderRadius.circular(12)),
          child: Column(
            children: [
              Row(
                children: [
                  const Icon(Icons.radio_button_checked, color: Colors.green, size: 16),
                  const SizedBox(width: 10),
                  Expanded(
                    child: TextField(
                      controller: pickupCtrl,
                      decoration: const InputDecoration(border: InputBorder.none, isDense: true, labelText: 'Pickup (Point A)'),
                    ),
                  ),
                ],
              ),
              const Divider(height: 14),
              Row(
                children: [
                  const Icon(Icons.location_on, color: Colors.redAccent, size: 18),
                  const SizedBox(width: 10),
                  Expanded(
                    child: TextField(
                      controller: dropCtrl,
                      decoration: const InputDecoration(border: InputBorder.none, isDense: true, labelText: 'Drop (Point Z)'),
                    ),
                  ),
                ],
              ),
            ],
          ),
        ),
        const Padding(
          padding: EdgeInsets.symmetric(horizontal: 16.0),
          child: Align(alignment: Alignment.centerLeft, child: Text('Choose Vehicle', style: TextStyle(fontWeight: FontWeight.bold))),
        ),
        Expanded(
          child: ListView.builder(
            itemCount: fleets.length,
            padding: const EdgeInsets.all(12),
            itemBuilder: (context, index) {
              final item = fleets[index];
              final isSelected = selectedVehicle == index;
              return GestureDetector(
                onTap: () => setState(() => selectedVehicle = index),
                child: Container(
                  margin: const EdgeInsets.only(bottom: 8),
                  padding: const EdgeInsets.all(12),
                  decoration: BoxDecoration(
                    color: Colors.white,
                    border: Border.all(color: isSelected ? const Color(0xFF1D4ED8) : Colors.transparent, width: 2),
                    borderRadius: BorderRadius.circular(10),
                  ),
                  child: Row(
                    children: [
                      Icon(item['icon'] as IconData, color: const Color(0xFF1D4ED8), size: 30),
                      const SizedBox(width: 12),
                      Expanded(
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Text(item['name'], style: const TextStyle(fontWeight: FontWeight.bold)),
                            Text('Capacity: ${item['cap']}', style: const TextStyle(color: Colors.grey, fontSize: 12)),
                          ],
                        ),
                      ),
                      Text(item['fare'], style: const TextStyle(fontWeight: FontWeight.w900, fontSize: 16)),
                    ],
                  ),
                ),
              );
            },
          ),
        ),
        Container(
          padding: const EdgeInsets.all(16),
          color: Colors.white,
          child: SizedBox(
            width: double.infinity,
            height: 48,
            child: ElevatedButton(
              style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF1D4ED8)),
              onPressed: isSendingOrder
                  ? null
                  : () async {
                      setState(() => isSendingOrder = true);
                      await LiveOrderService.sendBookingToCloud(
                        pickup: pickupCtrl.text,
                        drop: dropCtrl.text,
                        vehicle: activeVehicle['name'],
                        fare: activeVehicle['fare'],
                        customerPhone: widget.customerPhone,
                      );
                      setState(() => isSendingOrder = false);

                      if (mounted) {
                        Navigator.push(
                          context,
                          MaterialPageRoute(
                            builder: (context) => CustomerLiveWaitingScreen(
                              pickup: pickupCtrl.text,
                              drop: dropCtrl.text,
                              fare: activeVehicle['fare'],
                              vehicle: activeVehicle['name'],
                            ),
                          ),
                        );
                      }
                    },
              child: isSendingOrder
                  ? const CircularProgressIndicator(color: Colors.white)
                  : Text('Book & Send Request to Drivers (${activeVehicle['fare']})', style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
            ),
          ),
        )
      ],
    );
  }
}

