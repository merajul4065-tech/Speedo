                      ),
                      const SizedBox(height: 10),
                      SizedBox(
                        width: double.infinity,
                        child: ElevatedButton(
                          style: ElevatedButton.styleFrom(backgroundColor: Colors.green),
                          onPressed: () {
                            if (otpInputCtrl.text.trim() == "4829") {
                              setState(() => tripStarted = true);
                            } else {
                              ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Invalid OTP! Enter 4829')));
                            }
                          },
                          child: const Text('Verify OTP & Start Ride', style: TextStyle(color: Colors.white)),
                        ),
                      ),
                    ] else ...[
                      Container(
                        padding: const EdgeInsets.all(12),
                        decoration: BoxDecoration(color: Colors.green.withValues(alpha: 0.2), borderRadius: BorderRadius.circular(8)),
                        child: const Center(child: Text('Trip Ongoing to Destination...', style: TextStyle(color: Colors.greenAccent, fontWeight: FontWeight.bold))),
                      ),
                      const SizedBox(height: 12),
                      SizedBox(
                        width: double.infinity,
                        child: ElevatedButton(
                          style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF1D4ED8)),
                          onPressed: () {
                            setState(() {
                              LiveOrderService.orderAcceptedByDriver = false;
                              LiveOrderService.hasNewOrderForDriver = false;
                              tripStarted = false;
                              walletEarnings += 290;
                              otpInputCtrl.clear();
                            });
                          },
                          child: const Text('Complete Trip & Collect Cash', style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                        ),
                      ),
                    ]
                  ],
                ),
              ),
            ),
        ],
      ),
    );
