// ------------------------------------------------------------------
// 4. DRIVER PARTNER DASHBOARD (LISTENING TO LIVE REQUESTS)
// ------------------------------------------------------------------
class DriverLiveDashboard extends StatefulWidget {
  const DriverLiveDashboard({super.key});

  @override
  State<DriverLiveDashboard> createState() => _DriverLiveDashboardState();
}

class _DriverLiveDashboardState extends State<DriverLiveDashboard> {
  bool isDutyOn = true;
  Timer? orderPollingTimer;
  final TextEditingController otpInputCtrl = TextEditingController();
  bool tripStarted = false;
  int walletEarnings = 1420;

  @override
  void initState() {
    super.initState();
    orderPollingTimer = Timer.periodic(const Duration(seconds: 1), (timer) {
      if (mounted) setState(() {});
    });
  }

  @override
  void dispose() {
    orderPollingTimer?.cancel();
    super.dispose();
  }

  @override
  Widget build(BuildContext context) {
    bool hasIncoming = LiveOrderService.hasNewOrderForDriver && isDutyOn;
    var order = LiveOrderService.activeLiveOrder;

    return Container(
      color: const Color(0xFF111827),
      padding: const EdgeInsets.all(16),
      child: Column(
        children: [
          Container(
            padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 10),
            decoration: BoxDecoration(
              color: const Color(0xFF1F2937),
              borderRadius: BorderRadius.circular(12),
              border: Border.all(color: isDutyOn ? Colors.green : Colors.red),
            ),
            child: Row(
              mainAxisAlignment: MainAxisAlignment.spaceBetween,
              children: [
                Row(
                  children: [
                    CircleAvatar(radius: 5, backgroundColor: isDutyOn ? Colors.green : Colors.red),
                    const SizedBox(width: 8),
                    Text(
                      isDutyOn ? 'DUTY ONLINE (LISTENING FOR CUSTOMER RIDES)' : 'DUTY OFFLINE',
                      style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize: 11),
                    ),
                  ],
                ),
                Switch(
                  value: isDutyOn,
                  activeColor: Colors.green,
                  onChanged: (val) => setState(() => isDutyOn = val),
                )
              ],
            ),
          ),
          const SizedBox(height: 14),
          if (!hasIncoming && !LiveOrderService.orderAcceptedByDriver)
            Expanded(
              child: Center(
                child: Column(
                  mainAxisAlignment: MainAxisAlignment.center,
                  children: [
                    const Icon(Icons.radar, size: 70, color: Color(0xFF60A5FA)),
                    const SizedBox(height: 14),
                    const Text('Radar is active...', style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                    const SizedBox(height: 6),
                    const Text(
                      'Waiting for customer booking...\nGo to Customer Mode and click "Book" to test!',
                      style: TextStyle(color: Colors.white54, fontSize: 13),
                      textAlign: TextAlign.center,
                    ),
                  ],
                ),
              ),
            )
          else if (hasIncoming && !LiveOrderService.orderAcceptedByDriver)
            Expanded(
              child: Container(
                padding: const EdgeInsets.all(16),
                decoration: BoxDecoration(
                  color: const Color(0xFF1F2937),
                  borderRadius: BorderRadius.circular(14),
                  border: Border.all(color: Colors.amberAccent, width: 2),
                ),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    Row(
                      mainAxisAlignment: MainAxisAlignment.spaceBetween,
                      children: [
                        const Text('⚡ NEW CUSTOMER REQUEST', style: TextStyle(color: Colors.amberAccent, fontWeight: FontWeight.w900)),
                        Text('${order?['fare'] ?? '₹250'} Cash', style: const TextStyle(color: Colors.greenAccent, fontWeight: FontWeight.w900, fontSize: 18)),
                      ],
                    ),
                    const Divider(color: Colors.white24, height: 20),
                    Text('Vehicle: ${order?['vehicle'] ?? 'Tata Ace'}', style: const TextStyle(color: Colors.white70, fontSize: 12)),
                    const SizedBox(height: 8),
                    Text('Pickup (A): ${order?['pickup'] ?? ''}', style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                    const SizedBox(height: 6),
                    Text('Drop (Z): ${order?['drop'] ?? ''}', style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                    const Spacer(),
                    Row(
                      children: [
                        Expanded(
                          child: OutlinedButton(
                            onPressed: () {
                              setState(() {
                                LiveOrderService.hasNewOrderForDriver = false;
                              });
                            },
                            child: const Text('Decline', style: TextStyle(color: Colors.redAccent)),
                          ),
                        ),
                        const SizedBox(width: 12),
                        Expanded(
                          child: ElevatedButton(
                            style: ElevatedButton.styleFrom(backgroundColor: Colors.green),
                            onPressed: () {
                              setState(() {
                                LiveOrderService.orderAcceptedByDriver = true;
                                LiveOrderService.hasNewOrderForDriver = false;
                              });
                            },
                            child: const Text('Accept Ride', style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                          ),
                        ),
                      ],
                    )
                  ],
                ),
              ),
            )
          else
            Expanded(
              child: Container(
                padding: const EdgeInsets.all(16),
                decoration: BoxDecoration(color: const Color(0xFF1F2937), borderRadius: BorderRadius.circular(14)),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    const Text('ORDER IN PROGRESS', style: TextStyle(color: Colors.greenAccent, fontWeight: FontWeight.bold)),
                    const Divider(color: Colors.white24, height: 16),
                    Text('Pickup: ${order?['pickup']}', style: const TextStyle(color: Colors.white70, fontSize: 12)),
                    Text('Drop: ${order?['drop']}', style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                    const Spacer(),
                    if (!tripStarted) ...[
                      const Text('Enter Customer OTP to Start Trip:', style: TextStyle(color: Colors.white70, fontSize: 12)),
                      const SizedBox(height: 8),
                      TextField(
                        controller: otpInputCtrl,
                        keyboardType: TextInputType.number,
                        style: const TextStyle(color: Colors.white, letterSpacing: 4, fontWeight: FontWeight.bold),
                        decoration: InputDecoration(
                          hintText: '4829',
                          hintStyle: const TextStyle(color: Colors.white24),
                          filled: true,
                          fillColor: const Color(0xFF111827),
                          border: OutlineInputBorder(borderRadius: BorderRadius.circular(8)),
