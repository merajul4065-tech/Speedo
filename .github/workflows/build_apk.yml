import 'package:http/http.dart' as http;

void main() {
  runApp(const SpeedoPorterLiveApp());
}

// Global Order State for Local & Cloud Bridge
class LiveOrderService {
  static const String endpoint = "https://jsonplaceholder.typicode.com/posts";
  static Map<String, dynamic>? activeLiveOrder;
  static bool hasNewOrderForDriver = false;
  static bool orderAcceptedByDriver = false;
  static bool orderCompleted = false;

  static Future<bool> sendBookingToCloud({
    required String pickup,
    required String drop,
    required String vehicle,
    required String fare,
    required String customerPhone,
  }) async {
    try {
      activeLiveOrder = {
        'orderId': 'ORD-${DateTime.now().millisecondsSinceEpoch.toString().substring(8)}',
        'customerPhone': customerPhone,
        'pickup': pickup,
        'drop': drop,
        'vehicle': vehicle,
        'fare': fare,
        'otp': '4829',
        'status': 'SEARCHING_DRIVER',
      };
      hasNewOrderForDriver = true;
      orderAcceptedByDriver = false;
      orderCompleted = false;

      // Cloud trigger
      await http.post(
        Uri.parse(endpoint),
        body: jsonEncode(activeLiveOrder),
        headers: {'Content-Type': 'application/json'},
      );
      return true;
    } catch (e) {
      return false;
    }
  }
}

