class CustomerQuickLogin extends StatefulWidget {
  final Function(String) onLoggedIn;
  const CustomerQuickLogin({super.key, required this.onLoggedIn});

  @override
  State<CustomerQuickLogin> createState() => _CustomerQuickLoginState();
}

class _CustomerQuickLoginState extends State<CustomerQuickLogin> {
  final TextEditingController phoneCtrl = TextEditingController();
  final TextEditingController otpCtrl = TextEditingController();
  bool otpSent = false;

  @override
  Widget build(BuildContext context) {
    return Padding(
      padding: const EdgeInsets.all(24.0),
      child: Column(
        crossAxisAlignment: CrossAxisAlignment.start,
        mainAxisAlignment: MainAxisAlignment.center,
        children: [
          const Icon(Icons.local_shipping, size: 48, color: Color(0xFF1D4ED8)),
          const SizedBox(height: 16),
          const Text('Customer Sign In', style: TextStyle(fontSize: 24, fontWeight: FontWeight.bold)),
          const Text('Enter mobile number to send real delivery requests', style: TextStyle(color: Colors.grey, fontSize: 13)),
          const SizedBox(height: 20),
          TextField(
            controller: phoneCtrl,
            keyboardType: TextInputType.phone,
            maxLength: 10,
            enabled: !otpSent,
            decoration: InputDecoration(
              counterText: '',
              prefixText: '+91 ',
              hintText: 'Enter 10-digit number',
              filled: true,
              fillColor: Colors.white,
              border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)),
            ),
          ),
          if (otpSent) ...[
            const SizedBox(height: 12),
            TextField(
              controller: otpCtrl,
              keyboardType: TextInputType.number,
              maxLength: 4,
              textAlign: TextAlign.center,
              style: const TextStyle(letterSpacing: 6, fontSize: 18, fontWeight: FontWeight.bold),
              decoration: InputDecoration(
                counterText: '',
                hintText: 'Demo OTP: 1234',
                filled: true,
                fillColor: Colors.white,
                border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)),
              ),
            ),
          ],
          const SizedBox(height: 18),
          SizedBox(
            width: double.infinity,
            height: 48,
            child: ElevatedButton(
              style: ElevatedButton.styleFrom(
                backgroundColor: const Color(0xFF1D4ED8),
                shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(10)),
              ),
              onPressed: () {
                if (!otpSent) {
                  if (phoneCtrl.text.trim().length == 10) {
                    setState(() => otpSent = true);
                  }
                } else {
                  if (otpCtrl.text.trim() == "1234") {
                    widget.onLoggedIn(phoneCtrl.text.trim());
                  }
                }
              },
              child: Text(
                otpSent ? 'Verify & Continue' : 'Get OTP',
                style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold),
              ),
            ),
          )
        ],
      ),
    );
  }
}

